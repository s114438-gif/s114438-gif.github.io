<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 貪吃蛇 - 終極防崩潰版</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    overscroll-behavior-y: none;
    touch-action: pan-x pan-y;
}

h1 {
    margin: 10px 0;
    font-size: 24px;
}

#info-panel {
    font-size: 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.score-box {
    background: #222;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid #444;
}

#high-score-box {
    color: #ffcc00;
    border-color: #ffcc00;
}

.game-container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin: 0 auto;
    padding: 0 10px;
    max-width: 100%;
}

.difficulty-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #222;
    padding: 12px;
    border: 2px solid #444;
    border-radius: 8px;
}

.difficulty-panel h3 {
    margin: 0 0 5px 0;
    font-size: 16px;
    color: #aaa;
}

.diff-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    cursor: pointer;
    touch-action: manipulation; 
}

.diff-btn.active {
    background: #00ff00;
    color: black;
    border-color: #fff;
}

/* 確保畫布在手機上完美呈現正方形，不會縮水或變形 */
canvas {
    background: #000;
    border: 3px solid white;
    display: block;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1; 
}

/* 虛擬方向鍵 */
#d-pad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
    margin-bottom: 15px;
}

.d-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #666;
    border-radius: 10px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.d-btn:active {
    background: rgba(0, 255, 0, 0.4);
    border-color: #00ff00;
}

#btn-up { grid-column: 2; grid-row: 1; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }

/* 開始按鈕 */
#controls {
    margin-top: 5px;
    margin-bottom: 20px;
}

#start-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    touch-action: manipulation;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

#start-btn:active {
    background: #2980b9;
    transform: translateY(2px);
}

@media (max-width: 600px) {
    .game-container {
        flex-direction: column;
        align-items: center;
    }
    .difficulty-panel {
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        justify-content: space-around;
        padding: 10px;
    }
    .difficulty-panel h3 {
        display: none;
    }
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="info-panel">
    <div class="score-box">分數：<span id="score">0</span></div>
    <div class="score-box" id="high-score-box"><span id="high-score-label">👑 最高紀錄</span>：<span id="high-score">0</span></div>
</div>

<div class="game-container">
    <div class="difficulty-panel">
        <button class="diff-btn" id="btn-easy" onclick="changeDifficulty('easy')">難度 1</button>
        <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">難度 2</button>
        <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">難度 3</button>
    </div>

    <div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>
</div>

<div id="controls">
    <button id="start-btn" onclick="startGame()">▶ 開始遊戲</button>
</div>

<div id="d-pad">
    <div class="d-btn" id="btn-up" onclick="setDirection(0, -1)">▲</div>
    <div class="d-btn" id="btn-left" onclick="setDirection(-1, 0)">◀</div>
    <div class="d-btn" id="btn-down" onclick="setDirection(0, 1)">▼</div>
    <div class="d-btn" id="btn-right" onclick="setDirection(1, 0)">▶</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("high-score");
const highScoreLabelEl = document.getElementById("high-score-label");
const startBtn = document.getElementById("start-btn");

const grid = 20;
const tileCount = 20;

let snake;
let dx;
let dy;
let food;
let score;
let highScore = 0;
let gameOver;
let isGameRunning = false;
let changeDirectionExecuted;
let gameInterval; 
let currentSpeedSetting = 'normal';

const speeds = {
    easy: 180,    
    normal: 120,  
    hard: 70      
};

const difficultyNames = {
    easy: "難度 1",
    normal: "難度 2",
    hard: "難度 3"
};

// --- 安全的 LocalStorage 讀寫防護網 ---
function safeGetHighScore(key) {
    try {
        let val = localStorage.getItem(key);
        return val ? parseInt(val) : 0;
    } catch (e) {
        console.warn("無法讀取紀錄，可能是瀏覽器限制", e);
        return 0;
    }
}

function safeSetHighScore(key, val) {
    try {
        localStorage.setItem(key, val);
    } catch (e) {
        console.warn("無法儲存紀錄，可能是瀏覽器限制", e);
    }
}
// ------------------------------------

function randomFood(){
    return {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function loadHighScore() {
    const key = "snakeHighScore_" + currentSpeedSetting; 
    highScore = safeGetHighScore(key);
    highScoreLabelEl.textContent = `👑 ${difficultyNames[currentSpeedSetting]}`;
    highScoreEl.textContent = highScore;
}

function changeDifficulty(level) {
    currentSpeedSetting = level;
    updateButtonStyles();
    loadHighScore();
    resetGame(); 
}

function updateButtonStyles() {
    document.getElementById('btn-easy').className = 'diff-btn';
    document.getElementById('btn-normal').className = 'diff-btn';
    document.getElementById('btn-hard').className = 'diff-btn';
    
    if (currentSpeedSetting === 'easy') document.getElementById('btn-easy').className = 'diff-btn active';
    if (currentSpeedSetting === 'normal') document.getElementById('btn-normal').className = 'diff-btn active';
    if (currentSpeedSetting === 'hard') document.getElementById('btn-hard').className = 'diff-btn active';
}

function resetGame() {
    clearInterval(gameInterval);
    isGameRunning = false;
    gameOver = false;
    
    snake = [
        {x:10, y:10},
        {x:9, y:10},
        {x:8, y:10}
    ];

    dx = 1;
    dy = 0;
    food = randomFood();
    score = 0;
    changeDirectionExecuted = false;
    scoreEl.textContent = "0";
    
    startBtn.textContent = "▶ 開始遊戲";
    startBtn.style.background = "#3498db";

    draw(); 
}

function startGame() {
    if (gameOver) {
        resetGame();
    }
    
    if (!isGameRunning) {
        isGameRunning = true;
        startBtn.textContent = "🔄 重新開始";
        startBtn.style.background = "#e74c3c"; 
        
        clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, speeds[currentSpeedSetting]);
    } else {
        resetGame();
        startGame();
    }
}

function setDirection(newDx, newDy) {
    if (!isGameRunning && !gameOver) {
        startGame();
    }
    
    if (gameOver) {
        resetGame();
        return;
    }
    
    if (changeDirectionExecuted) return;
    
    if (dx !== 0 && newDx === -dx) return;
    if (dy !== 0 && newDy === -dy) return;

    dx = newDx;
    dy = newDy;
    changeDirectionExecuted = true;
}

document.addEventListener("keydown", (e) => {
    if(gameOver && (e.code==="Space" || e.code==="Enter")){
        resetGame();
        return;
    }
    
    if(!isGameRunning && !gameOver && (e.code==="Space" || e.code==="Enter")){
        startGame();
        return;
    }
    
    if(e.key==="ArrowUp" || e.key==="w" || e.key==="W") setDirection(0, -1);
    if(e.key==="ArrowDown" || e.key==="s" || e.key==="S") setDirection(0, 1);
    if(e.key==="ArrowLeft" || e.key==="a" || e.key==="A") setDirection(-1, 0);
    if(e.key==="ArrowRight" || e.key==="d" || e.key==="D") setDirection(1, 0);
});

function update(){
    if(!isGameRunning || gameOver) return;

    changeDirectionExecuted = false;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount){
        gameOver = true;
        return;
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
        score++;
        scoreEl.textContent = score;

        if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            const key = "snakeHighScore_" + currentSpeedSetting;
            safeSetHighScore(key, highScore);
        }

        do{
            food = randomFood();
        }while(
            snake.some(s => s.x===food.x && s.y===food.y)
        );
    } else {
        snake.pop();
    }

    for(let i = 1; i < snake.length; i++){
        if(snake[0].x === snake[i].x && snake[0].y === snake
