<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake Game</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    margin-top:10px;
}

canvas{
    background:black;
    border:3px solid white;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

.info{
    margin-top:10px;
    font-size:20px;
}
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>

<div class="info">
分數：<span id="score">0</span>
&nbsp;&nbsp;
最高分：<span id="highscore">0</span>
</div>

<canvas id="game" width="400" height="400"></canvas>

<br>

<button onclick="startGame()">重新開始</button>

<p>
方向鍵控制<br>
Space 或 Enter 重新開始
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");

const grid = 20;
const size = 400;

let snake;
let food;
let dx;
let dy;
let score;
let gameRunning;

let highscore =
parseInt(localStorage.getItem("snakeHighscore")) || 0;

highscoreEl.textContent = highscore;

function randomFood(){
    return {
        x: Math.floor(Math.random() * (size/grid)) * grid,
        y: Math.floor(Math.random() * (size/grid)) * grid
    };
}

function startGame(){

    snake = [
        {x:200,y:200}
    ];

    food = randomFood();

    dx = grid;
    dy = 0;

    score = 0;

    gameRunning = true;

    scoreEl.textContent = score;
}

function gameOver(){

    gameRunning = false;

    if(score > highscore){
        highscore = score;
        localStorage.setItem(
            "snakeHighscore",
            highscore
        );
        highscoreEl.textContent = highscore;
    }

    ctx.fillStyle="rgba(0,0,0,0.6)";
    ctx.fillRect(0,0,size,size);

    ctx.fillStyle="red";
    ctx.font="40px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "GAME OVER",
        size/2,
        size/2
    );

    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText(
        "按 Space 或 Enter",
        size/2,
        size/2 + 40
    );
}

document.addEventListener("keydown", e => {

    if(e.code==="Space" || e.code==="Enter"){
        e.preventDefault();
        startGame();
        return;
    }

    if(!gameRunning) return;

    if(e.key==="ArrowLeft" && dx===0){
        dx=-grid;
        dy=0;
    }

    if(e.key==="ArrowRight" && dx===0){
        dx=grid;
        dy=0;
    }

    if(e.key==="ArrowUp" && dy===0){
        dx=0;
        dy=-grid;
    }

    if(e.key==="ArrowDown" && dy===0){
        dx=0;
        dy=grid;
    }
});

function update(){

    if(!gameRunning) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= size ||
        head.y >= size
    ){
        gameOver();
        return;
    }

    for(let part of snake){

        if(
            head.x === part.x &&
            head.y === part.y
        ){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(
        head.x === food.x &&
        head.y === food.y
    ){

        score++;

        scoreEl.textContent = score;

        food = randomFood();

    }else{

        snake.pop();
    }
}

function draw(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,size,size);

    ctx.fillStyle="red";
    ctx.fillRect(
        food.x,
        food.y,
        grid,
        grid
    );

    snake.forEach((part,index)=>{

        ctx.fillStyle =
            index===0
            ? "#00ff00"
            : "#44aa44";

        ctx.fillRect(
            part.x,
            part.y,
            grid,
            grid
        );
    });
}

function loop(){

    update();

    draw();

    if(!gameRunning){

        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,size,size);

        ctx.fillStyle="red";
        ctx.font="40px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "GAME OVER",
            size/2,
            size/2
        );

        ctx.fillStyle="white";
        ctx.font="20px Arial";
        ctx.fillText(
            "Space 或 Enter 重新開始",
            size/2,
            size/2 + 40
        );
    }
}

startGame();

setInterval(loop,100);
</script>

</body>
</html>
