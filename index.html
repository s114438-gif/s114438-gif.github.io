<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 貪吃蛇 - 手機滑動雙用版</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    /* 防止手機瀏覽器隨意下拉重新整理 */
    overscroll-behavior-y: contain; 
}

h1 {
    margin: 10px 0;
    font-size: 24px;
}

/* 分數看板區 */
#info-panel {
    font-size: 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.score-box {
    background: #222;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid #444;
}

#high-score-box {
    color: #ffcc00;
    border-color: #ffcc00;
}

/* 支援手機的彈性排版 */
.game-container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 15px;
    margin: 0 auto;
    padding: 0 10px;
    max-width: 100%;
}

/* 難度選單面板 */
.difficulty-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #222;
    padding: 12px;
    border: 2px solid #444;
    border-radius: 8px;
}

.difficulty-panel h3 {
    margin: 0 0 5px 0;
    font-size: 16px;
    color: #aaa;
}

/* 按鈕樣式 */
.diff-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    cursor: pointer;
}

/* 被選中時的亮綠色 */
.diff-btn.active {
    background: #00ff00;
    color: black;
    border-color: #fff;
}

/* 遊戲畫布 - 加上 max-width 確保在小手機上不會爆出去 */
canvas {
    background: #000;
    border: 3px solid white;
    display: block;
    max-width: 100%;
    height: auto;
    /* 核心：禁止智慧型手機在畫布上滑動時觸控預設滾動，全留給遊戲監聽 */
    touch-action: none; 
}

#controls {
    margin-top: 10px;
}

#restart-btn {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 5px;
}

#restart-btn:hover {
    background: #c0392b;
}

.tip {
    font-size: 14px;
    color: #888;
    margin: 5px 0;
}

/* 當手機直立（寬度不夠）時，自動把難度選單移到 Canvas 上方 */
@media (max-width: 550px) {
    .game-container {
        flex-direction: column;
        align-items: center;
    }
    .difficulty-panel {
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        justify-content: space-around;
    }
    .difficulty-panel h3 {
        display: none; /* 空間不足，隱藏標題 */
    }
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="info-panel">
    <div class="score-box">分數：<span id="score">0</span></div>
    <div class="score-box" id="high-score-box"><span id="high-score-label">👑 最高紀錄</span>：<span id="high-score">0</span></div>
</div>

<div class="game-container">
    
    <div class="difficulty-panel">
        <h3>選擇難度</h3>
        <button class="diff-btn" id="btn-easy" onclick="changeDifficulty('easy')">難度 1 (慢)</button>
        <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">難度 2 (中)</button>
        <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">難度 3 (快)</button>
    </div>

    <div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>
</div>

<div id="controls">
    <button id="restart-btn" onclick="resetGame()">重新開始</button>
    <p class="tip">🖥️ 電腦：請用鍵盤方向鍵控制</p>
    <p class="tip">📱 手機：在遊戲畫面上<b>用手指滑動</b>即可控制轉彎</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("high-score");
const highScoreLabelEl = document.getElementById("high-score-label");

const grid = 20;
const tileCount = 20;

let snake;
let dx;
let dy;
let food;
let score;
let highScore = 0;
let gameOver;
let changeDirectionExecuted;
let gameInterval; 
let currentSpeedSetting = 'normal';

const speeds = {
    easy: 180,    
    normal: 120,  
    hard: 70      
};

const difficultyNames = {
    easy: "難度 1",
    normal: "難度 2",
    hard: "難度 3"
};

if (localStorage.getItem("snakeHighScore")) {
    highScore = parseInt(localStorage.getItem("snakeHighScore"));
    highScoreEl.textContent = highScore;
}

function randomFood(){
    return {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function loadHighScore() {
    const key = "snakeHighScore_" + currentSpeedSetting; 
    if (localStorage.getItem(key)) {
        highScore = parseInt(localStorage.getItem(key));
    } else {
        highScore = 0; 
    }
    highScoreLabelEl.textContent = `👑 ${difficultyNames[currentSpeedSetting]} 最高紀錄`;
    highScoreEl.textContent = highScore;
}

function changeDifficulty(level) {
    currentSpeedSetting = level;
    updateButtonStyles();
    loadHighScore();
    resetGame();
}

function updateButtonStyles() {
    document.getElementById('btn-easy').className = 'diff-btn';
    document.getElementById('btn-normal').className = 'diff-btn';
    document.getElementById('btn-hard').className = 'diff-btn';
    
    if (currentSpeedSetting === 'easy') document.getElementById('btn-easy').className = 'diff-btn active';
    if (currentSpeedSetting === 'normal') document.getElementById('btn-normal').className = 'diff-btn active';
    if (currentSpeedSetting === 'hard') document.getElementById('btn-hard').className = 'diff-btn active';
}

function resetGame() {
    snake = [
        {x:10, y:10},
        {x:9, y:10},
        {x:8, y:10}
    ];

    dx = 1;
    dy = 0;

    food = randomFood();
    score = 0;
    gameOver = false;
    changeDirectionExecuted = false;

    scoreEl.textContent = "0";

    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speeds[currentSpeedSetting]);
}

// ----------------------------------------------------
// ⌨️ 控制系統一：電腦鍵盤監聽
// ----------------------------------------------------
document.addEventListener("keydown", (e) => {
    if(gameOver){
        if(e.code==="Space" || e.code==="Enter"){
            resetGame();
        }
        return;
    }

    if(changeDirectionExecuted) return;

    if(e.key==="ArrowUp" && dy===0){ dx=0; dy=-1; changeDirectionExecuted = true; }
    if(e.key==="ArrowDown" && dy===0){ dx=0; dy=1; changeDirectionExecuted = true; }
    if(e.key==="ArrowLeft" && dx===0){ dx=-1; dy=0; changeDirectionExecuted = true; }
    if(e.key==="ArrowRight" && dx===0){ dx=1; dy=0; changeDirectionExecuted = true; }
});

// ----------------------------------------------------
// 📱 控制系統二：手機觸控滑動監聽 (Swipe Detection)
// ----------------------------------------------------
let touchStartX = 0;
let touchStartY = 0;

// 當手指一碰到 Canvas
canvas.addEventListener("touchstart", (e) => {
    if (gameOver) {
        resetGame(); // 手機版死了之後，隨便在畫布上摸一下就能復活重新開始！
        return;
    }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

// 當手指在 Canvas 上滑動並離開時
canvas.addEventListener("touchend", (e) => {
    if (changeDirectionExecuted || gameOver) return;
