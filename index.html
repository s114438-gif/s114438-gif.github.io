<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 貪吃蛇 - 終極穩定版</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 15px 0;
}

/* 分數看板區 */
#info-panel {
    font-size: 22px;
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.score-box {
    background: #222;
    padding: 5px 15px;
    border-radius: 5px;
    border: 1px solid #444;
}

#high-score-box {
    color: #ffcc00;
    border-color: #ffcc00;
}

/* 左右並排的外容器 */
.game-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin: 0 auto;
    padding: 0 10px;
}

/* 左邊難度選單 */
.difficulty-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #222;
    padding: 15px;
    border: 2px solid #444;
    border-radius: 8px;
}

.difficulty-panel h3 {
    margin: 0 0 5px 0;
    font-size: 18px;
    color: #aaa;
}

/* 按鈕樣式 */
.diff-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    cursor: pointer;
}

.diff-btn:hover {
    background: #444;
}

/* 被選中時的亮綠色 */
.diff-btn.active {
    background: #00ff00;
    color: black;
    border-color: #fff;
}

/* 遊戲畫布 */
canvas {
    background: #000;
    border: 3px solid white;
    display: block;
}

#controls {
    margin-top: 15px;
}

#restart-btn {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 5px;
}

#restart-btn:hover {
    background: #c0392b;
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="info-panel">
    <div class="score-box">分數：<span id="score">0</span></div>
    <div class="score-box" id="high-score-box">👑 最高紀錄：<span id="high-score">0</span></div>
</div>

<div class="game-container">
    
    <div class="difficulty-panel">
        <h3>選擇難度</h3>
        <button class="diff-btn" id="btn-easy" onclick="changeDifficulty('easy')">難度 1 (慢)</button>
        <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">難度 2 (中)</button>
        <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">難度 3 (快)</button>
    </div>

    <div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>
</div>

<div id="controls">
    <button id="restart-btn" onclick="resetGame()">重新開始</button>
    <p>方向鍵控制，撞牆或撞自己遊戲結束</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("high-score");

const grid = 20;
const tileCount = 20;

let snake;
let dx;
let dy;
let food;
let score;
let highScore = 0;
let gameOver;
let changeDirectionExecuted;
let gameInterval; 
let currentSpeedSetting = 'normal'; // 預設中等難度

// 速度設定（數字越小移速越快）
const speeds = {
    easy: 180,    
    normal: 120,  
    hard: 70      
};

// 讀取最高紀錄
if (localStorage.getItem("snakeHighScore")) {
    highScore = parseInt(localStorage.getItem("snakeHighScore"));
    highScoreEl.textContent = highScore;
}

function randomFood(){
    return {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function changeDifficulty(level) {
    currentSpeedSetting = level;
    updateButtonStyles();
    resetGame();
}

function updateButtonStyles() {
    document.getElementById('btn-easy').className = 'diff-btn';
    document.getElementById('btn-normal').className = 'diff-btn';
    document.getElementById('btn-hard').className = 'diff-btn';
    
    if (currentSpeedSetting === 'easy') document.getElementById('btn-easy').className = 'diff-btn active';
    if (currentSpeedSetting === 'normal') document.getElementById('btn-normal').className = 'diff-btn active';
    if (currentSpeedSetting === 'hard') document.getElementById('btn-hard').className = 'diff-btn active';
}

function resetGame(){
    snake = [
        {x:10, y:10},
        {x:9, y:10},
        {x:8, y:10}
    ];

    dx = 1;
    dy = 0;

    food = randomFood();
    score = 0;
    gameOver = false;
    changeDirectionExecuted = false;

    scoreEl.textContent = "0";

    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speeds[currentSpeedSetting]);
}

document.addEventListener("keydown", (e) => {
    if(gameOver){
        if(e.code==="Space" || e.code==="Enter"){
            resetGame();
        }
        return;
    }

    if(changeDirectionExecuted) return;

    if(e.key==="ArrowUp" && dy===0){ dx=0; dy=-1; changeDirectionExecuted = true; }
    if(e.key==="ArrowDown" && dy===0){ dx=0; dy=1; changeDirectionExecuted = true; }
    if(e.key==="ArrowLeft" && dx===0){ dx=-1; dy=0; changeDirectionExecuted = true; }
    if(e.key==="ArrowRight" && dx===0){ dx=1; dy=0; changeDirectionExecuted = true; }
});

function update(){
    if(gameOver) return;

    changeDirectionExecuted = false;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount){
        gameOver = true;
        return;
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
        score++;
        scoreEl.textContent = score;

        if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem("snakeHighScore", highScore);
        }

        do{
            food = randomFood();
        }while(
            snake.some(s => s.x===food.x && s.y===food.y)
        );
    } else {
        snake.pop();
    }

    for(let i = 1; i < snake.length; i++){
        if(snake[0].x === snake[i].x && snake[0].y === snake[i].y){
            gameOver = true;
            return;
        }
    }
}

function drawSnakeHead(head){
    const px = head.x * grid;
    const py = head.y * grid;

    // 頭部主體 (改回最安全的 fillRect)
    ctx.fillStyle = "#00ff00";
    ctx.fillRect(px+1, py+1, 18, 18);

    let eye1x, eye1y, eye2x, eye2y;
    if(dx===1){ eye1x = px+13; eye1y = py+6; eye2x = px+13; eye2y = py+14; }
    else if(dx===-1){ eye1x = px+7; eye1y = py+6; eye2x = px+7; eye2y = py+14; }
    else if(dy===-1){ eye1x = px+6; eye1y = py+7; eye2x = px+14; eye2y = py+7; }
    else { eye1x = px+6; eye1y = py+13; eye2x = px+14; eye2y = py+13; }

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(eye1x, eye1y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2x, eye2y, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(eye1x, eye1y, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2x, eye2y, 1.5, 0, Math.PI*2);
    ctx.fill();
}

function draw(){
    // 背景
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 400, 400);

    // 食物
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(food.x*grid+10, food.y*grid+10, 8, 0, Math.PI*2);
    ctx.fill();

    // 蛇身 (改回最安全的 fillRect)
    ctx.fillStyle = "#3cb043";
    for(let i=snake.length-1; i>=1; i--){
        const part = snake[i];
        ctx.fillRect(part.x*grid+2, part.y*grid+2, 16, 16);
    }

    // 蛇頭
    drawSnakeHead(snake[0]);

    // 遊戲結束畫面
    if(gameOver){
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, 400, 400);

        ctx.fillStyle = "red";
        ctx.font = "36px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 200, 180);

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("按 Space 或 Enter 重新開始", 200, 220);
    }
}

function gameLoop(){
    update();
    draw();
}

// 確保一開始樣式和遊戲正常啟動
updateButtonStyles();
resetGame();
</script>

</body>
</html>
