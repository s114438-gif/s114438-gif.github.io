<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}
canvas{
    background:black;
    border:2px solid white;
}
</style>
</head>
<body>

<h1>🐍 Snake</h1>
<p>方向鍵控制</p>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;

let snake = [
    {x: 10, y: 10}
];

let dx = 1;
let dy = 0;

let food = {
    x: 5,
    y: 5
};

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowUp" && dy===0){
        dx=0; dy=-1;
    }

    if(e.key==="ArrowDown" && dy===0){
        dx=0; dy=1;
    }

    if(e.key==="ArrowLeft" && dx===0){
        dx=-1; dy=0;
    }

    if(e.key==="ArrowRight" && dx===0){
        dx=1; dy=0;
    }
});

function loop(){

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){

        food = {
            x: Math.floor(Math.random()*20),
            y: Math.floor(Math.random()*20)
        };

    }else{
        snake.pop();
    }

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= 20 ||
        head.y >= 20
    ){
        alert("Game Over");
        location.reload();
        return;
    }

    ctx.clearRect(0,0,400,400);

    ctx.fillStyle="red";
    ctx.fillRect(food.x*20,food.y*20,20,20);

    ctx.fillStyle="lime";

    snake.forEach(part=>{
        ctx.fillRect(
            part.x*20,
            part.y*20,
            20,
            20
        );
    });
}

setInterval(loop,150);
</script>

</body>
</html>
