<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin:20px 0 10px;
}

#score{
    font-size:24px;
    margin-bottom:10px;
}

canvas{
    border:3px solid white;
    background:black;
}

#msg{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<div id="msg">
使用 ↑ ↓ ← → 控制方向<br>
按空白鍵重新開始
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");

const box = 20;
const rows = canvas.width / box;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;

function randomFood(){
    return {
        x: Math.floor(Math.random()*rows)*box,
        y: Math.floor(Math.random()*rows)*box
    };
}

function resetGame(){
    snake = [
        {x: 200, y: 200}
    ];

    food = randomFood();

    dx = box;
    dy = 0;

    score = 0;
    gameOver = false;

    scoreText.textContent = "Score: 0";
}

resetGame();

document.addEventListener("keydown", e => {

   if(e.code === "Space" || e.code === "Enter"){
    resetGame();
    return;
}

    if(gameOver) return;

    if(e.key === "ArrowLeft" && dx === 0){
        dx = -box;
        dy = 0;
    }

    if(e.key === "ArrowRight" && dx === 0){
        dx = box;
        dy = 0;
    }

    if(e.key === "ArrowUp" && dy === 0){
        dx = 0;
        dy = -box;
    }

    if(e.key === "ArrowDown" && dy === 0){
        dx = 0;
        dy = box;
    }
});

function draw(){

    if(gameOver){

        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,400,400);

        ctx.fillStyle="red";
        ctx.font="40px Arial";
        ctx.textAlign="center";
        ctx.fillText("GAME OVER",200,200);

        ctx.font="20px Arial";
        ctx.fillStyle="white";
        ctx.fillText("按空白鍵重新開始",200,240);

        return;
    }

    ctx.fillStyle="black";
    ctx.fillRect(0,0,400,400);

    // food
    ctx.fillStyle="red";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x + dx;
    let headY = snake[0].y + dy;

    // wall collision
    if(
        headX < 0 ||
        headY < 0 ||
        headX >= 400 ||
        headY >= 400
    ){
        gameOver = true;
        return;
    }

    // self collision
    for(let i=0;i<snake.length;i++){
        if(
            snake[i].x === headX &&
            snake[i].y === headY
        ){
            gameOver = true;
            return;
        }
    }

    const head = {
        x: headX,
        y: headY
    };

    snake.unshift(head);

    if(headX === food.x && headY === food.y){

        score++;
        scoreText.textContent = "Score: " + score;

        food = randomFood();

    }else{
        snake.pop();
    }

    // snake
    for(let i=0;i<snake.length;i++){

        ctx.fillStyle =
            i===0 ? "#00ff00" : "#44aa44";

        ctx.fillRect(
            snake[i].x,
            snake[i].y,
            box,https://github.com/s114438-gif/s114438-gif.github.io/tree/main
            box
        );

        ctx.strokeStyle="#111";
        ctx.strokeRect(
            snake[i].x,
            snake[i].y,
            box,
            box
        );
    }
}

setInterval(draw,100);
</script>

</body>
</html>

    pygame.quit()

if __name__ == "__main__":
    game()
