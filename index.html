<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 貪吃蛇 - 終極修復版</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    overscroll-behavior-y: none;
    touch-action: pan-x pan-y;
}

h1 {
    margin: 10px 0;
    font-size: 24px;
}

#info-panel {
    font-size: 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.score-box {
    background: #222;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid #444;
}

#high-score-box {
    color: #ffcc00;
    border-color: #ffcc00;
}

.game-container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin: 0 auto;
    padding: 0 10px;
    max-width: 100%;
}

.difficulty-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #222;
    padding: 12px;
    border: 2px solid #444;
    border-radius: 8px;
}

.difficulty-panel h3 {
    margin: 0 0 5px 0;
    font-size: 16px;
    color: #aaa;
}

.diff-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    cursor: pointer;
    touch-action: manipulation; 
}

.diff-btn.active {
    background: #00ff00;
    color: black;
    border-color: #fff;
}

/* 確保畫布在所有設備上都能顯示，不再使用容易出錯的 aspect-ratio */
canvas {
    background: #000;
    border: 3px solid white;
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto; 
    margin: 0 auto;
}

/* 虛擬方向鍵 */
#d-pad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
    margin-bottom: 15px;
}

.d-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #666;
    border-radius: 10px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.d-btn:active {
    background: rgba(0, 255, 0, 0.4);
    border-color: #00ff00;
}

#btn-up { grid-column: 2; grid-row: 1; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }

/* 開始按鈕 */
#controls {
    margin-top: 5px;
    margin-bottom: 20px;
}

#start-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    touch-action: manipulation;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

#start-btn:active {
    background: #2980b9;
    transform: translateY(2px);
}

@media (max-width: 600px) {
    .game-container {
        flex-direction: column;
        align-items: center;
    }
    .difficulty-panel {
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        justify-content: space-around;
        padding: 10px;
    }
    .difficulty-panel h3 {
        display: none;
    }
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="info-panel">
    <div class="score-box">分數：<span id="score">0</span></div>
    <div class="score-box" id="high-score-box"><span id="high-score-label">👑 最高紀錄</span>：<span id="high-score">0</span></div>
</div>

<div class="game-container">
    <div class="difficulty-panel">
        <button class="diff-btn" id="btn-easy" onclick="changeDifficulty('easy')">難度 1</button>
        <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">難度 2</button>
        <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">難度 3</button>
    </div>

    <div>
        <canvas id="game" width="400" height="400">你的瀏覽器不支援 Canvas，請更新瀏覽器！</canvas>
    </div>
</div>

<div id="controls">
    <button id="start-btn" onclick="startGame()">▶ 開始遊戲</button>
</div>

<div id="d-pad">
    <div class="d-btn" id="btn-up" onclick="setDirection(0, -1)">▲</div>
    <div class="d-btn" id="btn-left" onclick="setDirection(-1, 0)">◀</div>
    <div class="d-btn" id="btn-down" onclick="setDirection(0, 1)">▼</div>
    <div class="d-btn" id="btn-right" onclick="setDirection(1, 0)">▶</div>
</div>

<div id="error-log" style="color: #ff4444; font-weight: bold; margin-top: 10px;"></div>

<script>
// 使用 try-catch 包覆所有邏輯，確保有錯誤時我們能看到原因
try {
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const highScoreLabelEl = document.getElementById("high-score-label");
    const startBtn = document.getElementById("start-btn");

    const grid = 20;
    const tileCount = 20;

    let snake;
    let dx;
    let dy;
    let food;
    let score;
    let highScore = 0;
    let gameOver;
    let isGameRunning = false;
    let changeDirectionExecuted;
    let gameInterval; 
    let currentSpeedSetting = 'normal';

    const speeds = {
        easy: 180,    
        normal: 120,  
        hard: 70      
    };

    const difficultyNames = {
        easy: "難度 1",
        normal: "難度 2",
        hard: "難度 3"
    };

    function safeGetHighScore(key) {
        try {
            let val = localStorage.getItem(key);
            return val ? parseInt(val) : 0;
        } catch (e) {
            return 0;
        }
    }

    function safeSetHighScore(key, val) {
        try {
            localStorage.setItem(key, val);
        } catch (e) {
        }
    }

    function randomFood(){
        return {
            x: Math.floor(Math.random()*tileCount),
            y: Math.floor(Math.random()*tileCount)
        };
    }

    function loadHighScore() {
        const key = "snakeHighScore_" + currentSpeedSetting; 
        highScore = safeGetHighScore(key);
        highScoreLabelEl.textContent = `👑 ${difficultyNames[currentSpeedSetting]}`;
        highScoreEl.textContent = highScore;
    }

    // 將 changeDifficulty 暴露到全域，確保 HTML 中的 onclick 抓得到
    window.changeDifficulty = function(level) {
        currentSpeedSetting = level;
        updateButtonStyles();
        loadHighScore();
        resetGame(); 
    };

    function updateButtonStyles() {
        document.getElementById('btn-easy').className = 'diff-btn';
        document.getElementById('btn-normal').className = 'diff-btn';
        document.getElementById('btn-hard').className = 'diff-btn';
        
        if (currentSpeedSetting === 'easy') document.getElementById('btn-easy').className = 'diff-btn active';
        if (currentSpeedSetting === 'normal') document.getElementById('btn-normal').className = 'diff-btn active';
        if (currentSpeedSetting === 'hard') document.getElementById('btn-hard').className = 'diff-btn active';
    }

    function resetGame() {
        clearInterval(gameInterval);
        isGameRunning = false;
        gameOver = false;
        
        snake = [
            {x:10, y:10},
            {x:9, y:10},
            {x:8, y:10}
        ];

        dx = 1;
        dy = 0;
        food = randomFood();
        score = 0;
        changeDirectionExecuted = false;
        scoreEl.textContent = "0";
        
        startBtn.textContent = "▶ 開始遊戲";
        startBtn.style.background = "#3498db";

        draw(); 
    }

    window.startGame = function() {
        if (gameOver) {
            resetGame();
        }
        
        if (!isGameRunning) {
            isGameRunning = true;
            startBtn.textContent = "🔄 重新開始";
            startBtn.style.background = "#e74c3c"; 
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, speeds[currentSpeedSetting]);
        } else {
            resetGame();
            window.startGame();
        }
    };

    window.setDirection = function(newDx, newDy) {
        if (!isGameRunning && !gameOver) {
            window.startGame();
        }
        
        if (gameOver) {
            resetGame();
            return;
        }
        
        if (changeDirectionExecuted) return;
        
        if (dx !== 0 && newDx === -dx) return;
        if (dy !== 0 && newDy === -dy) return;

        dx = newDx;
        dy = newDy;
        changeDirectionExecuted = true;
    };

    document.addEventListener("keydown", (e) => {
        if(gameOver && (e.code==="Space" || e.code==="Enter")){
            resetGame();
            e.preventDefault();
            return;
        }
        
        if(!isGameRunning && !gameOver && (e.code==="Space" || e.code==="Enter")){
            window.startGame();
            e.preventDefault();
            return;
        }
        
        if(e.key==="ArrowUp" || e.key==="w" || e.key==="W") { window.setDirection(0, -1); e.preventDefault(); }
        if(e.key==="ArrowDown" || e.key==="s" || e.key==="S") { window.setDirection(0, 1); e.preventDefault(); }
        if(e.key==="ArrowLeft" || e.key==="a" || e.key==="A") { window.setDirection(-1, 0); e.preventDefault(); }
        if(e.key==="ArrowRight" || e.key==="d" || e.key==="D") { window.setDirection(1, 0); e.preventDefault(); }
    });

    function update(){
        if(!isGameRunning || gameOver) return;

        changeDirectionExecuted = false;

        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };

        if(head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount){
            gameOver = true;
            return;
        }

        snake.unshift(head);

        if(head.x===food.x && head.y===food.y){
            score++;
            scoreEl.textContent = score;

            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                const key = "snakeHighScore_" + currentSpeedSetting;
                safeSetHighScore(key, highScore);
            }

            do{
                food = randomFood();
            }while(
                snake.some(s => s.x===food.x && s.y===food.y)
            );
        } else {
            snake.pop();
        }

        for(let i = 1; i < snake.length; i++){
            if(snake[0].x === snake[i].x && snake[0].y === snake[i].y){
                gameOver = true;
                return;
            }
        }
    }

    function drawSnakeHead(head){
        const px = head.x * grid;
        const py = head.y * grid;

        ctx.fillStyle = "#00ff00";
        ctx.fillRect(px+1, py+1, 18, 18);

        let eye1x, eye1y, eye2x, eye2y;
        if(dx===1){ eye1x = px+13; eye1y = py+6; eye2x = px+13; eye2y = py+14; }
        else if(dx===-1){ eye1x = px+7; eye1y = py+6; eye2x = px+7; eye2y = py+14; }
        else if(dy===-1){ eye1x = px+6; eye1y = py+7; eye2x = px+14; eye2y = py+7; }
        else { eye1x = px+6; eye1y = py+13; eye2x = px+14; eye2y = py+13; }

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(eye1x, eye1y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(eye2x, eye2y, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(eye1x, eye1y, 1.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(eye2x, eye2y, 1.5, 0, Math.PI*2);
        ctx.fill();
    }

    function draw(){
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff4444";
        ctx.fillRect(food.x * grid + 1, food.y * grid + 1, 18, 18);

        for(let i = 0; i < snake.length; i++){
            if(i === 0){
                drawSnakeHead(snake[i]);
            } else {
                ctx.fillStyle = "#00cc00"; 
                ctx.fillRect(snake[i].x * grid + 1, snake[i].y * grid + 1, 18, 18);
            }
        }

        if(gameOver){
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "white";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText("遊戲結束!", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "20px Arial";
            ctx.fillStyle = "#aaa";
            ctx.fillText("點擊「重新開始」", canvas.width / 2, canvas.height / 2 + 20);
        }
    }

    function gameLoop(){
        update();
        draw();
    }

    // 啟動遊戲初始設定
    loadHighScore();
    updateButtonStyles();
    resetGame();

} catch (error) {
    // 若發生任何嚴重錯誤，將錯誤顯示在畫面底部
    document.getElementById("error-log").innerText = "⚠️ 程式載入發生錯誤：" + error.message;
}
</script>
</body>
</html>
