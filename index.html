<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 貪吃蛇 - 手機完美版</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    overscroll-behavior-y: none; /* 徹底禁止手機下拉重整 */
    touch-action: pan-x pan-y;
}

h1 {
    margin: 10px 0;
    font-size: 24px;
}

/* 分數看板區 */
#info-panel {
    font-size: 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.score-box {
    background: #222;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid #444;
}

#high-score-box {
    color: #ffcc00;
    border-color: #ffcc00;
}

/* 遊戲版面配置 */
.game-container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin: 0 auto;
    padding: 0 10px;
    max-width: 100%;
}

.difficulty-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #222;
    padding: 12px;
    border: 2px solid #444;
    border-radius: 8px;
}

.difficulty-panel h3 {
    margin: 0 0 5px 0;
    font-size: 16px;
    color: #aaa;
}

.diff-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    cursor: pointer;
    /* 移除手機點擊延遲 */
    touch-action: manipulation; 
}

.diff-btn.active {
    background: #00ff00;
    color: black;
    border-color: #fff;
}

canvas {
    background: #000;
    border: 3px solid white;
    display: block;
    max-width: 100%;
    height: auto;
}

/* =========================================
   📱 手機專屬：虛擬方向鍵 (D-Pad) 樣式
   ========================================= */
#d-pad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
    margin-bottom: 20px;
}

.d-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #666;
    border-radius: 10px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none; /* 防止連按時反白文字 */
    -webkit-user-select: none;
    touch-action: manipulation; /* 確保點擊瞬間觸發，不延遲 */
}

.d-btn:active {
    background: rgba(0, 255, 0, 0.4);
    border-color: #00ff00;
}

/* 按鈕位置排版成十字型 */
#btn-up { grid-column: 2; grid-row: 1; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }

/* 其他控制按鈕 */
#controls {
    margin-top: 10px;
}

#restart-btn {
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 5px;
    margin-bottom: 15px;
    touch-action: manipulation;
}

/* 響應式：手機直立時的自動排版 */
@media (max-width: 600px) {
    .game-container {
        flex-direction: column;
        align-items: center;
    }
    .difficulty-panel {
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        justify-content: space-around;
        padding: 10px;
    }
    .difficulty-panel h3 {
        display: none;
    }
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="info-panel">
    <div class="score-box">分數：<span id="score">0</span></div>
    <div class="score-box" id="high-score-box"><span id="high-score-label">👑 最高紀錄</span>：<span id="high-score">0</span></div>
</div>

<div class="game-container">
    <div class="difficulty-panel">
        <h3>選擇難度</h3>
        <button class="diff-btn" id="btn-easy" onclick="changeDifficulty('easy')">難度 1</button>
        <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">難度 2</button>
        <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">難度 3</button>
    </div>

    <div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>
</div>

<div id="d-pad">
    <div class="d-btn" id="btn-up" onclick="setDirection(0, -1)">▲</div>
    <div class="d-btn" id="btn-left" onclick="setDirection(-1, 0)">◀</div>
    <div class="d-btn" id="btn-down" onclick="setDirection(0, 1)">▼</div>
    <div class="d-btn" id="btn-right" onclick="setDirection(1, 0)">▶</div>
</div>

<div id="controls">
    <button id="restart-btn" onclick="resetGame()">重新開始遊戲</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("high-score");
const highScoreLabelEl = document.getElementById("high-score-label");

const grid = 20;
const tileCount = 20;

let snake;
let dx;
let dy;
let food;
let score;
let highScore = 0;
let gameOver;
let changeDirectionExecuted;
let gameInterval; 
let currentSpeedSetting = 'normal';

const speeds = {
    easy: 180,    
    normal: 120,  
    hard: 70      
};

const difficultyNames = {
    easy: "難度 1",
    normal: "難度 2",
    hard: "難度 3"
};

if (localStorage.getItem("snakeHighScore")) {
    highScore = parseInt(localStorage.getItem("snakeHighScore"));
    highScoreEl.textContent = highScore;
}

function randomFood(){
    return {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function loadHighScore() {
    const key = "snakeHighScore_" + currentSpeedSetting; 
    if (localStorage.getItem(key)) {
        highScore = parseInt(localStorage.getItem(key));
    } else {
        highScore = 0; 
    }
    highScoreLabelEl.textContent = `👑 ${difficultyNames[currentSpeedSetting]}`;
    highScoreEl.textContent = highScore;
}

function changeDifficulty(level) {
    currentSpeedSetting = level;
    updateButtonStyles();
    loadHighScore();
    resetGame();
}

function updateButtonStyles() {
    document.getElementById('btn-easy').className = 'diff-btn';
    document.getElementById('btn-normal').className = 'diff-btn';
    document.getElementById('btn-hard').className = 'diff-btn';
    
    if (currentSpeedSetting === 'easy') document.getElementById('btn-easy').className = 'diff-btn active';
    if (currentSpeedSetting === 'normal') document.getElementById('btn-normal').className = 'diff-btn active';
    if (currentSpeedSetting === 'hard') document.getElementById('btn-hard').className = 'diff-btn active';
