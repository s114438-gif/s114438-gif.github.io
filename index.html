<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 貪吃蛇</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
}

h1{
    margin:15px 0;
}

#score{
    font-size:22px;
    margin-bottom:10px;
}

canvas{
    background:#000;
    border:3px solid white;
}

button{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>🐍 貪吃蛇</h1>

<div id="score">分數：0</div>

<canvas id="game" width="400" height="400"></canvas>

<br>
<button onclick="resetGame()">重新開始</button>

<p>方向鍵控制，撞牆或撞自己遊戲結束</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const grid = 20;
const tileCount = 20;

let snake;
let dx;
let dy;
let food;
let score;
let gameOver;
let changeDirectionExecuted; // 新增：防止單一 frame 內連續變向的鎖

function randomFood(){
    return {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function resetGame(){
    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    dx = 1;
    dy = 0;

    food = randomFood();

    score = 0;
    gameOver = false;
    changeDirectionExecuted = false;

    scoreEl.textContent = "分數：0";
}

document.addEventListener("keydown",(e)=>{

    if(gameOver){
        if(e.code==="Space" || e.code==="Enter"){
            resetGame();
        }
        return;
    }

    // 如果在這個 frame 已經換過方向了，就不能再換，防止連續按鍵導致自殺
    if(changeDirectionExecuted) return;

    if(e.key==="ArrowUp" && dy===0){
        dx=0;
        dy=-1;
        changeDirectionExecuted = true;
    }

    if(e.key==="ArrowDown" && dy===0){
        dx=0;
        dy=1;
        changeDirectionExecuted = true;
    }

    if(e.key==="ArrowLeft" && dx===0){
        dx=-1;
        dy=0;
        changeDirectionExecuted = true;
    }

    if(e.key==="ArrowRight" && dx===0){
        dx=1;
        dy=0;
        changeDirectionExecuted = true;
    }
});

function update(){

    if(gameOver) return;

    // 允許下一次 frame 改變方向
    changeDirectionExecuted = false;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // 撞牆偵測
    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ){
        gameOver = true;
        return;
    }

    // 先移動蛇頭
    snake.unshift(head);

    // 檢查是否吃到食物
    if(head.x===food.x && head.y===food.y){
        score++;
        scoreEl.textContent = "分數：" + score;

        do{
            food = randomFood();
        }while(
            snake.some(s => s.x===food.x && s.y===food.y)
        );
    } else {
        // 沒吃到食物，才把尾巴去掉
        snake.pop();
    }

    // 撞自己偵測（從索引 1 開始檢查，因為索引 0 是剛放進去的頭）
    for(let i = 1; i < snake.length; i++){
        if(snake[0].x === snake[i].x && snake[0].y === snake[i].y){
            gameOver = true;
            return;
        }
    }
}

function drawSnakeHead(head){

    const px = head.x * grid;
    const py = head.y * grid;

    ctx.fillStyle = "#00ff00";

    ctx.beginPath();
    ctx.roundRect(px+1, py+1, 18, 18, 8);
    ctx.fill();

    let eye1x, eye1y, eye2x, eye2y;

    if(dx===1){ 
        eye1x = px+13; eye1y = py+6;
        eye2x = px+13; eye2y = py+14;
    }
    else if(dx===-1){ 
        eye1x = px+7; eye1y = py+6;
        eye2x = px+7; eye2y = py+14;
    }
    else if(dy===-1){ 
        eye1x = px+6; eye1y = py+7;
        eye2x = px+14; eye2y = py+7;
    }
    else{ 
        eye1x = px+6; eye1y = py+13;
        eye2x = px+14; eye2y = py+13;
    }

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(eye1x, eye1y, 3, 0, Math.PI*2);
    ctx.arc(eye2x, eye2y, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(eye1x, eye1y, 1.5, 0, Math.PI*2);
    ctx.arc(eye2x, eye2y, 1.5, 0, Math.PI*2);
    ctx.fill();
}

function draw(){

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,400,400);

    // 食物
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(food.x*grid+10, food.y*grid+10, 8, 0, Math.PI*2);
    ctx.fill();

    // 蛇身 (排除第 0 節的頭)
    for(let i=snake.length-1; i>=1; i--){
        const part = snake[i];
        ctx.fillStyle="#3cb043";
        ctx.beginPath();
        ctx.roundRect(part.x*grid+2, part.y*grid+2, 16, 16, 6);
        ctx.fill();
    }

    // 蛇頭
    drawSnakeHead(snake[0]);

    if(gameOver){
        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,400,400);

        ctx.fillStyle="red";
        ctx.font="36px Arial";
        ctx.textAlign="center";
        ctx.fillText("GAME OVER", 200, 180);

        ctx.fillStyle="white";
        ctx.font="18px Arial";
        ctx.fillText("按 Space 或 Enter 重新開始", 200, 220);
    }
}

function gameLoop(){
    update();
    draw();
}

resetGame();
setInterval(gameLoop,120);
</script>

</body>
</html>
